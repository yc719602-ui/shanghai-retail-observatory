services:
  - type: web
    name: shanghai-retail-observatory
    runtime: static
    buildCommand: node scripts/prepare-startup.mjs && node scripts/verify.mjs
    staticPublishPath: ./public
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/evidence/*.avif
        name: Content-Type
        value: image/avif
      - path: /assets/img/*.avif
        name: Content-Type
        value: image/avif
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /data/manifest.json
        name: Cache-Control
        value: no-cache
